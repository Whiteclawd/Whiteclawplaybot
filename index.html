<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🦞 Lobster Putih - Kumpul Koin!</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');
  :root {
    --ocean-deep: #0a1628; --coin-gold: #FFD700; --ui-bg: rgba(10,22,40,0.9);
    --accent: #00E5FF; --accent2: #64FFDA;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ocean-deep); font-family:'Nunito',sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; touch-action:none; }
  #game-wrapper { position:relative; width:400px; height:700px; border-radius:24px; overflow:hidden; box-shadow:0 0 60px rgba(0,229,255,0.25); border:1px solid rgba(0,229,255,0.2); }
  #game-canvas { display:block; width:400px; height:700px; }
  #ui-overlay { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:20px 20px 0; pointer-events:none; z-index:10; }
  .score-box { background:var(--ui-bg); border:1px solid rgba(0,229,255,0.3); border-radius:16px; padding:8px 16px; backdrop-filter:blur(10px); }
  .score-label { font-family:'Fredoka One',cursive; font-size:11px; color:var(--accent); letter-spacing:1px; text-transform:uppercase; display:block; }
  .score-value { font-family:'Fredoka One',cursive; font-size:28px; color:var(--coin-gold); text-shadow:0 0 15px rgba(255,215,0,0.6); display:block; line-height:1; }
  #lives-box { display:flex; gap:4px; background:var(--ui-bg); border:1px solid rgba(0,229,255,0.3); border-radius:16px; padding:8px 12px; backdrop-filter:blur(10px); align-items:center; }
  .heart { font-size:18px; } .heart.lost { filter:grayscale(1); opacity:0.3; }
  .screen { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; background:linear-gradient(180deg,rgba(4,16,32,0.97) 0%,rgba(10,31,61,0.97) 100%); backdrop-filter:blur(4px); }
  .screen.hidden { display:none; }
  .game-title { font-family:'Fredoka One',cursive; font-size:42px; color:white; text-align:center; text-shadow:0 0 30px var(--accent); line-height:1.1; margin-bottom:8px; }
  .game-subtitle { font-size:16px; color:var(--accent); text-align:center; margin-bottom:30px; opacity:0.8; }
  .title-lobster { font-size:90px; margin-bottom:20px; animation:float 2.5s ease-in-out infinite; filter:drop-shadow(0 10px 30px rgba(0,229,255,0.4)); }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-15px) rotate(3deg)} }
  .btn { font-family:'Fredoka One',cursive; font-size:22px; padding:16px 48px; border:none; border-radius:50px; cursor:pointer; transition:all 0.2s; pointer-events:all; }
  .btn-primary { background:linear-gradient(135deg,var(--accent),#0096b4); color:white; box-shadow:0 8px 30px rgba(0,229,255,0.4); }
  .btn-primary:active { transform:scale(0.97); }
  .btn-secondary { background:transparent; color:var(--accent); border:2px solid var(--accent); margin-top:12px; font-size:18px; padding:12px 36px; }
  .how-to { margin:16px 0; display:flex; flex-direction:column; gap:8px; max-width:280px; }
  .how-item { display:flex; align-items:center; gap:12px; background:rgba(0,229,255,0.07); border-radius:12px; padding:10px 14px; border:1px solid rgba(0,229,255,0.15); }
  .how-icon { font-size:22px; } .how-text { font-size:13px; color:rgba(255,255,255,0.8); line-height:1.3; }
  .over-result { font-family:'Fredoka One',cursive; font-size:60px; color:var(--coin-gold); text-shadow:0 0 30px rgba(255,215,0,0.5); margin:12px 0; }
  .over-label { font-size:14px; color:rgba(255,255,255,0.5); letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
  .high-score-badge { font-family:'Fredoka One',cursive; font-size:16px; color:var(--accent2); background:rgba(100,255,218,0.1); border:1px solid var(--accent2); border-radius:20px; padding:4px 16px; margin-bottom:20px; }
  #combo-display { position:absolute; top:90px; left:50%; transform:translateX(-50%); z-index:15; pointer-events:none; font-family:'Fredoka One',cursive; font-size:28px; color:var(--coin-gold); text-shadow:0 0 20px rgba(255,215,0,0.8); opacity:0; white-space:nowrap; }
  #combo-display.show { animation:comboAnim 0.8s forwards; }
  @keyframes comboAnim { 0%{transform:translateX(-50%) scale(0.5);opacity:1} 40%{transform:translateX(-50%) scale(1.2);opacity:1} 100%{transform:translateX(-50%) scale(1);opacity:0} }
  #controls-hint { position:absolute; bottom:20px; left:0; right:0; text-align:center; font-size:12px; color:rgba(255,255,255,0.3); pointer-events:none; z-index:5; }

  /* LEADERBOARD */
  #leaderboard { position:absolute; top:0; left:0; right:0; bottom:0; z-index:25; background:linear-gradient(180deg,rgba(4,16,32,0.98) 0%,rgba(10,31,61,0.98) 100%); display:flex; flex-direction:column; align-items:center; padding:30px 20px; overflow-y:auto; }
  #leaderboard.hidden { display:none; }
  #leaderboard h2 { font-family:'Fredoka One',cursive; font-size:32px; color:var(--coin-gold); margin-bottom:20px; text-shadow:0 0 20px rgba(255,215,0,0.5); }
  .lb-item { width:100%; max-width:320px; display:flex; align-items:center; gap:12px; background:rgba(0,229,255,0.07); border:1px solid rgba(0,229,255,0.15); border-radius:12px; padding:10px 16px; margin-bottom:8px; }
  .lb-rank { font-family:'Fredoka One',cursive; font-size:22px; color:var(--accent); width:36px; }
  .lb-name { flex:1; font-size:14px; color:white; font-weight:700; }
  .lb-score { font-family:'Fredoka One',cursive; font-size:20px; color:var(--coin-gold); }
  .lb-me { border-color:var(--coin-gold); background:rgba(255,215,0,0.08); }

  /* Player info */
  #player-info { position:absolute; bottom:70px; left:0; right:0; text-align:center; pointer-events:none; z-index:10; }
  #player-name-display { font-family:'Fredoka One',cursive; font-size:14px; color:rgba(0,229,255,0.7); }

  /* Total coins badge */
  #total-coins-box { background:var(--ui-bg); border:1px solid rgba(255,215,0,0.4); border-radius:12px; padding:4px 12px; margin-top:6px; display:inline-block; }
  #total-coins-label { font-family:'Fredoka One',cursive; font-size:12px; color:var(--coin-gold); }

  #save-status { font-size:12px; color:rgba(0,229,255,0.6); margin-top:8px; height:16px; }

  @media (max-width:440px) {
    #game-wrapper { width:100vw; height:100vh; border-radius:0; }
    #game-canvas { width:100vw; height:100vh; }
  }
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="game-canvas" width="400" height="700"></canvas>

  <div id="ui-overlay">
    <div class="score-box">
      <span class="score-label">🪙 Koin</span>
      <span class="score-value" id="score-display">0</span>
    </div>
    <div id="lives-box">
      <span class="heart" id="h1">❤️</span>
      <span class="heart" id="h2">❤️</span>
      <span class="heart" id="h3">❤️</span>
    </div>
  </div>

  <div id="combo-display"></div>

  <!-- Start Screen -->
  <div class="screen" id="start-screen">
    <div class="title-lobster">🦞</div>
    <div class="game-title">Lobster<br>Koin!</div>
    <div class="game-subtitle" id="welcome-text">Kumpulkan koin di lautan dalam!</div>
    <div id="total-coins-box"><span class="score-label">💰 Total Koin</span><span class="score-value" id="total-coins-display" style="font-size:20px">0</span></div>
    <div class="how-to">
      <div class="how-item"><span class="how-icon">👆</span><span class="how-text">Tap kiri/kanan untuk bergerak</span></div>
      <div class="how-item"><span class="how-icon">🪙</span><span class="how-text">Kumpulkan koin, hindari bom!</span></div>
      <div class="how-item"><span class="how-icon">✨</span><span class="how-text">Combo = poin berlipat!</span></div>
    </div>
    <button class="btn btn-primary" onclick="startGame()">🎮 Mulai Main!</button>
    <button class="btn btn-secondary" onclick="showLeaderboard()">🏆 Leaderboard</button>
  </div>

  <!-- Game Over Screen -->
  <div class="screen hidden" id="over-screen">
    <div class="title-lobster" style="font-size:70px;margin-bottom:10px">😵</div>
    <div class="game-title" style="font-size:34px">Game Over!</div>
    <div class="over-label">Skor Kamu</div>
    <div class="over-result" id="final-score">0</div>
    <div class="high-score-badge" id="hs-badge">🏆 Best: 0</div>
    <div id="save-status">Menyimpan skor...</div>
    <button class="btn btn-primary" onclick="startGame()">🔄 Main Lagi!</button>
    <button class="btn btn-secondary" onclick="showLeaderboard()">🏆 Leaderboard</button>
  </div>

  <!-- Leaderboard -->
  <div id="leaderboard" class="hidden">
    <h2>🏆 Top Pemain</h2>
    <div id="lb-list" style="width:100%;max-width:320px"></div>
    <button class="btn btn-secondary" style="margin-top:20px" onclick="hideLeaderboard()">← Kembali</button>
  </div>

  <div id="controls-hint">Tap kiri/kanan layar untuk gerak</div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, orderByChild, limitToLast, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDr7H76rXolMHLqULN0aF8z-kZQNjuuFpI",
  authDomain: "whiteclawplay.firebaseapp.com",
  databaseURL: "https://whiteclawplay-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "whiteclawplay",
  storageBucket: "whiteclawplay.firebasestorage.app",
  messagingSenderId: "113212401805",
  appId: "1:113212401805:web:c4be8b81507b6d6b8b7a9f",
  measurementId: "G-E0GD96Y73B"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ─── TELEGRAM USER ───
let tgUser = null;
let playerId = 'guest_' + Math.random().toString(36).substr(2,8);
let playerName = 'Pemain';

if (window.Telegram && window.Telegram.WebApp) {
  const tg = window.Telegram.WebApp;
  tg.expand();
  tgUser = tg.initDataUnsafe?.user;
  if (tgUser) {
    playerId = 'tg_' + tgUser.id;
    playerName = tgUser.first_name || tgUser.username || 'Pemain';
  }
}

document.getElementById('welcome-text').textContent = `Halo ${playerName}! Kumpulkan koin! 🌊`;

// ─── LOAD PLAYER DATA ───
let totalCoins = 0, bestScore = 0;

async function loadPlayerData() {
  try {
    const snap = await get(ref(db, 'players/' + playerId));
    if (snap.exists()) {
      const d = snap.val();
      totalCoins = d.totalCoins || 0;
      bestScore = d.bestScore || 0;
      document.getElementById('total-coins-display').textContent = totalCoins;
      document.getElementById('hs-badge').textContent = '🏆 Best: ' + bestScore;
    }
  } catch(e) { console.log('Load error:', e); }
}
loadPlayerData();

// ─── SAVE SCORE ───
window.saveScore = async function(score) {
  try {
    totalCoins += score;
    if (score > bestScore) bestScore = score;
    await set(ref(db, 'players/' + playerId), {
      name: playerName,
      totalCoins: totalCoins,
      bestScore: bestScore,
      lastPlayed: Date.now()
    });
    document.getElementById('total-coins-display').textContent = totalCoins;
    document.getElementById('save-status').textContent = '✅ Tersimpan! Total: ' + totalCoins + ' 🪙';
  } catch(e) {
    document.getElementById('save-status').textContent = '⚠️ Gagal simpan';
  }
}

// ─── LEADERBOARD ───
window.loadLeaderboard = async function() {
  const lbList = document.getElementById('lb-list');
  lbList.innerHTML = '<div style="color:rgba(255,255,255,0.5);text-align:center;padding:20px">Memuat...</div>';
  try {
    const q = query(ref(db, 'players'), orderByChild('bestScore'), limitToLast(10));
    const snap = await get(q);
    const players = [];
    snap.forEach(child => players.push({id: child.key, ...child.val()}));
    players.sort((a,b) => b.bestScore - a.bestScore);

    lbList.innerHTML = '';
    const medals = ['🥇','🥈','🥉'];
    players.forEach((p, i) => {
      const isMe = p.id === playerId;
      const div = document.createElement('div');
      div.className = 'lb-item' + (isMe ? ' lb-me' : '');
      div.innerHTML = `
        <span class="lb-rank">${medals[i] || (i+1)}</span>
        <span class="lb-name">${p.name}${isMe ? ' 👈' : ''}</span>
        <span class="lb-score">${p.bestScore} 🪙</span>
      `;
      lbList.appendChild(div);
    });
    if (players.length === 0) lbList.innerHTML = '<div style="color:rgba(255,255,255,0.4);text-align:center;padding:20px">Belum ada pemain</div>';
  } catch(e) {
    lbList.innerHTML = '<div style="color:rgba(255,100,100,0.8);text-align:center;padding:20px">Gagal memuat</div>';
  }
}
</script>

<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let state = 'idle';
let score = 0, highScore = 0, lives = 3, combo = 0, comboTimer = 0;
let frame = 0, speed = 2;
let items = [], bubbles = [], particles = [];
let lobster = { x: W/2, y: H-130, vx: 0, targetX: W/2 };
let bgStars = [];
for (let i=0;i<60;i++) bgStars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.3,alpha:Math.random()*0.5+0.1,speed:Math.random()*0.4+0.1});

canvas.addEventListener('click', handleInput);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput({clientX:e.touches[0].clientX}); }, {passive:false});
document.addEventListener('keydown', e => {
  if (state!=='playing') return;
  if (e.key==='ArrowLeft'||e.key==='a') lobster.targetX=Math.max(40,lobster.x-80);
  if (e.key==='ArrowRight'||e.key==='d') lobster.targetX=Math.min(W-40,lobster.x+80);
});

function handleInput(e) {
  if (state!=='playing') return;
  const rect = canvas.getBoundingClientRect();
  const cx = (e.clientX-rect.left)*(W/rect.width);
  lobster.targetX = cx < W/2 ? Math.max(40,lobster.x-90) : Math.min(W-40,lobster.x+90);
}

const ITEM_TYPES = [
  {type:'coin',emoji:'🪙',value:10,r:18,chance:0.55},
  {type:'gem',emoji:'💎',value:30,r:18,chance:0.15},
  {type:'star',emoji:'⭐',value:20,r:18,chance:0.12},
  {type:'bomb',emoji:'💣',value:-1,r:20,chance:0.12},
  {type:'shield',emoji:'🛡️',value:0,r:18,chance:0.06},
];

function spawnItem() {
  let roll=Math.random(), cumul=0, chosen=ITEM_TYPES[0];
  for (const t of ITEM_TYPES) { cumul+=t.chance; if(roll<cumul){chosen=t;break;} }
  items.push({...chosen,x:Math.random()*(W-60)+30,y:-30,vy:speed+Math.random()*1.5,rot:0,rotSpeed:(Math.random()-0.5)*0.12,wobble:Math.random()*Math.PI*2});
}

function spawnBubble() {
  bubbles.push({x:Math.random()*W,y:H+20,r:Math.random()*14+5,vy:-(Math.random()*1.5+0.5),alpha:Math.random()*0.3+0.05});
}

function drawBg() {
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#020d1a'); grad.addColorStop(0.5,'#0a1f3d'); grad.addColorStop(1,'#0d2a50');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,180,255,0.04)'; ctx.lineWidth=1;
  for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y+(frame*0.3%50));ctx.lineTo(W,y+(frame*0.3%50));ctx.stroke();}
  for(const s of bgStars){s.y+=s.speed;if(s.y>H)s.y=0;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(150,220,255,${s.alpha})`;ctx.fill();}
  const sg=ctx.createLinearGradient(0,H-60,0,H);
  sg.addColorStop(0,'rgba(10,50,90,0)');sg.addColorStop(1,'rgba(15,60,110,0.8)');
  ctx.fillStyle=sg;ctx.fillRect(0,H-60,W,60);
}

function drawBubbles() {
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i]; b.y+=b.vy; b.alpha-=0.0008;
    if(b.y<-20||b.alpha<=0){bubbles.splice(i,1);continue;}
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(100,200,255,${b.alpha})`;ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.arc(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.25,0,Math.PI*2);
    ctx.fillStyle=`rgba(200,240,255,${b.alpha*0.8})`;ctx.fill();
  }
}

function drawLobster() {
  const bobY=Math.sin(frame*0.07)*4, tiltX=(lobster.targetX-lobster.x)*0.03;
  ctx.save();ctx.translate(lobster.x,lobster.y+bobY);ctx.rotate(tiltX*0.15);
  const gg=ctx.createRadialGradient(0,0,5,0,0,50);
  gg.addColorStop(0,'rgba(200,240,255,0.3)');gg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gg;ctx.fillRect(-50,-50,100,100);
  ctx.font='60px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,229,255,0.6)';ctx.shadowBlur=20;
  ctx.fillText('🦞',0,0);ctx.shadowBlur=0;ctx.restore();
}

function drawItem(item) {
  item.wobble+=0.05;item.rot+=item.rotSpeed;
  ctx.save();ctx.translate(item.x+Math.sin(item.wobble)*3,item.y);ctx.rotate(item.rot);
  if(item.type==='coin'){
    const cg=ctx.createRadialGradient(-4,-4,2,0,0,item.r);
    cg.addColorStop(0,'#FFF9C4');cg.addColorStop(0.5,'#FFD700');cg.addColorStop(1,'#B8860B');
    ctx.beginPath();ctx.ellipse(0,0,item.r*Math.abs(Math.cos(item.wobble*2))+4,item.r,0,0,Math.PI*2);
    ctx.fillStyle=cg;ctx.shadowColor='#FFD700';ctx.shadowBlur=15;ctx.fill();
    ctx.strokeStyle='#B8860B';ctx.lineWidth=1.5;ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='bold 12px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('₿',0,0);
  } else {
    ctx.font=`${item.r*1.6}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    const colors={'gem':'#00E5FF','bomb':'#FF4444','star':'#FFD700','shield':'#64FFDA'};
    ctx.shadowColor=colors[item.type]||'#fff';ctx.shadowBlur=18;
    ctx.fillText(item.emoji,0,0);ctx.shadowBlur=0;
  }
  ctx.restore();
}

function drawParticles() {
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;p.alpha=p.life/p.maxLife;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.alpha,0,Math.PI*2);
    ctx.fillStyle=`rgba(${p.color},${p.alpha})`;ctx.fill();
  }
}

function spawnParticles(x,y,color){
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2,sp=Math.random()*4+1;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,r:Math.random()*5+2,color,life:25,maxLife:25,alpha:1});
  }
}

let shakeAmount=0;
function shakeCanvas(){shakeAmount=12;}

function showCombo(c,gained){
  const el=document.getElementById('combo-display');
  el.textContent=c>=5?`🔥 x${c} COMBO! +${gained}`:c>=3?`⚡ x${c} COMBO! +${gained}`:`+${gained}`;
  el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
}

function checkCollisions(){
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    const dist=Math.sqrt((it.x-lobster.x)**2+(it.y-lobster.y)**2);
    if(dist<it.r+28){
      items.splice(i,1);
      if(it.type==='bomb'){
        lives=Math.max(0,lives-1);updateLives();shakeCanvas();
        spawnParticles(it.x,it.y,'255,80,80');combo=0;
        if(lives<=0)endGame();
      } else {
        combo++;comboTimer=90;
        const gained=it.value*Math.min(combo,5);
        score+=gained;updateScore();
        if(it.type==='shield'){lives=Math.min(3,lives+1);updateLives();}
        spawnParticles(it.x,it.y,it.type==='gem'?'0,229,255':it.type==='star'?'255,220,0':'255,215,0');
        showCombo(combo,gained);
      }
    } else if(it.y>H+40){items.splice(i,1);if(it.type!=='bomb')combo=0;}
  }
}

function updateScore(){document.getElementById('score-display').textContent=score;}
function updateLives(){['h1','h2','h3'].forEach((id,i)=>document.getElementById(id).classList.toggle('lost',i>=lives));}

let raf;
function loop(){
  frame++;
  if(frame%Math.max(30,80-Math.floor(score/200))===0)spawnItem();
  if(frame%12===0)spawnBubble();
  speed=2+score/600;
  if(comboTimer>0)comboTimer--;else if(combo>0)combo=0;
  lobster.vx=(lobster.targetX-lobster.x)*0.18;
  lobster.x+=lobster.vx;lobster.x=Math.max(35,Math.min(W-35,lobster.x));
  for(const it of items)it.y+=it.vy*(speed/2.2);
  let ox=0,oy=0;
  if(shakeAmount>0){ox=(Math.random()-0.5)*shakeAmount;oy=(Math.random()-0.5)*shakeAmount;shakeAmount*=0.8;if(shakeAmount<0.5)shakeAmount=0;}
  ctx.save();ctx.translate(ox,oy);
  drawBg();drawBubbles();
  for(const it of items)drawItem(it);
  drawLobster();drawParticles();
  ctx.restore();checkCollisions();
  raf=requestAnimationFrame(loop);
}

function startGame(){
  score=0;lives=3;combo=0;comboTimer=0;frame=0;speed=2;items=[];bubbles=[];particles=[];
  lobster.x=W/2;lobster.targetX=W/2;state='playing';
  updateScore();updateLives();
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('over-screen').classList.add('hidden');
  document.getElementById('leaderboard').classList.add('hidden');
  cancelAnimationFrame(raf);loop();
}

function endGame(){
  state='over';cancelAnimationFrame(raf);
  if(score>highScore)highScore=score;
  document.getElementById('final-score').textContent=score;
  document.getElementById('hs-badge').textContent='🏆 Best: '+highScore;
  document.getElementById('save-status').textContent='Menyimpan skor...';
  document.getElementById('over-screen').classList.remove('hidden');
  if(window.saveScore)window.saveScore(score);
}

function showLeaderboard(){
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('over-screen').classList.add('hidden');
  document.getElementById('leaderboard').classList.remove('hidden');
  if(window.loadLeaderboard)window.loadLeaderboard();
}

function hideLeaderboard(){
  document.getElementById('leaderboard').classList.add('hidden');
  document.getElementById('start-screen').classList.remove('hidden');
}

(function idleLoop(){
  if(state!=='idle')return;
  frame++;drawBg();drawBubbles();
  if(frame%12===0)spawnBubble();
  requestAnimationFrame(idleLoop);
})();
</script>
</body>
</html>
